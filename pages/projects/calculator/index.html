<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="../../../css/calculator.css">
    <link rel="icon" href="../../../assets/images/brand/aywhite-logo.png" type="image/x-icon">
    <title>My Calculator</title>
</head>
<body>
    <div class="display-container">
        <div class="history-display" id="history"></div>
        <div class="input-display" id="display">0</div>
        <input type="hidden" id="display-input" value="0">
    </div>

    <div class="allButton">
        <button class="btn">DEL</button>
        <button class="btn">C</button>
        <button class="btn">%</button>
        <button class="op-btn">/</button>
        
        <button class="num-btn">7</button>
        <button class="num-btn">8</button>
        <button class="num-btn">9</button>
        <button class="op-btn">*</button>
        
        <button class="num-btn">4</button>
        <button class="num-btn">5</button>
        <button class="num-btn">6</button>
        <button class="op-btn">-</button>
        
        <button class="num-btn">1</button>
        <button class="num-btn">2</button>
        <button class="num-btn">3</button>
        <button class="op-btn">+</button>
        
        <button class="num-btn">0</button>
        <button class="num-btn">.</button>
        <button class="equal-btn">=</button>
    </div>

    <script src="../../../js/calculator.js"></script>
</body>
</html>
